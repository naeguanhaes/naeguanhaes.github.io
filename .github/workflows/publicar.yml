# Publica o site no GitHub Pages a cada envio para a main.
# Substitui o processo interno "pages build and deployment",
# que passou a falhar e a ficar preso na fila.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          # histórico inteiro: o inspetor da VERSAO compara com o commit que
          # estava publicado antes deste envio, que pode estar vários commits
          # atrás quando se envia mais de um de uma vez
          fetch-depth: 0
      - name: Checar os dados de horários, calendário e avisos
        run: node ferramentas/checar-dados.js
      - name: Inspecionar o site (travessões, links, cache offline, divs)
        run: node ferramentas/checar-site.js
      - name: Inspecionar a acessibilidade (WCAG 2.1 AA)
        run: node ferramentas/checar-acessibilidade.js
      - name: Inspecionar a consistência (menu, rodapé, busca, sitemap)
        run: node ferramentas/checar-consistencia.js
      - name: Provar que as ementas continuam iguais ao PPC
        run: node ferramentas/checar-ementas.js
      - name: Conferir se assets/min está em dia com as origens
        run: node ferramentas/checar-minificados.js
      - name: Cobrar a troca da VERSAO do cache offline
        env:
          # o que estava no ar antes deste envio
          NAE_BASE: ${{ github.event.before }}
        run: node ferramentas/checar-versao.js

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar o Pages
        uses: actions/configure-pages@v5
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
